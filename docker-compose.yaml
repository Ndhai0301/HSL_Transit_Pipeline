name: hsl

services: 
  kafka: 
    image: confluentinc/cp-kafka:8.0.9
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093   
      CLUSTER_ID: lPPbt4h8Qayba2RpE-cs5A

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
  
  kafka_ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.1
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: hsl
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"   # UI is a Java app; cap heap, RAM is shared by the whole stack
    depends_on:
      kafka:
        condition: service_healthy

  warehouse:
    image: timescale/timescaledb:2.32.1-pg16   # pin an exact version after first pull (see below)
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by the init scripts in warehouse/init (step 2.4) to create roles
      PIPELINE_PASSWORD: ${PIPELINE_PASSWORD}
      BI_READER_PASSWORD: ${BI_READER_PASSWORD}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      TZ: UTC                          # server default time zone: all timestamps in UTC
      TS_TUNE_MEMORY: 1GB              # timescaledb-tune sizes memory for 1 GB, not the whole host
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      # Mount files one by one: mounting the whole folder would hide the image's own
      # 000_install_timescaledb.sh / 001_timescaledb_tune.sh
      - ./warehouse/init/01_roles.sh:/docker-entrypoint-initdb.d/101_roles.sh:ro
      - ./warehouse/init/02_schema.sql:/docker-entrypoint-initdb.d/102_schema.sql:ro
    shm_size: 256mb                    # Docker's default 64 MB breaks parallel queries
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  kafka-data:
  warehouse-data: